<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<meta name="robots" content="noindex"/>
<title>Cone</title>
<!--
  Retired in #52. athletes.html's picker, PRs and goals all live on me.html, which is
  themed and reachable from the nav; this page never was. The file stays (instead of
  being deleted) for two reasons: old bookmarks keep working, and sw.js precaches
  './athletes.html' via cache.addAll(), which rejects ATOMICALLY on a 404 — removing
  the file would stop the service worker from installing for every user, on every page.
-->
<script>
(function () {
  var id = new URLSearchParams(location.search).get('athlete');
  location.replace('me.html' + (id ? '?id=' + encodeURIComponent(id) : ''));
})();
</script>
</head>
<body></body>
</html>
